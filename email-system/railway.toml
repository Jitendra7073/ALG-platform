# =============================================================================
# Railway Deployment Configuration
# =============================================================================
# https://railway.app/reference

[build]
# Build command for Next.js
builder = "NIXPACKS"
buildCommand = "npm run build"
watchPatterns = ["src/**", "public/**", "package.json"]

# -----------------------------------------------------------------------------
# PostgreSQL Service
# -----------------------------------------------------------------------------
[service.postgresql]
# Railway automatically provisions PostgreSQL
# Access via DATABASE_URL environment variable

# -----------------------------------------------------------------------------
# Redis Service
# -----------------------------------------------------------------------------
[service.redis]
# Railway automatically provisions Redis (Upstash)
# Access via REDIS_URL environment variable

# -----------------------------------------------------------------------------
# Next.js Dashboard Service
# -----------------------------------------------------------------------------
[service.dashboard]
name = "email-system-dashboard"
runtime = "nodejs20"

# Health check
healthcheckPath = "/api/health"
healthcheckTimeout = 300
readinessPath = "/api/health"

# Environment variables (set in Railway dashboard, these are defaults)
[service.dashboard.variables]
NODE_ENV = "production"
PORT = "3000"

# Auto-generated by Railway
# DATABASE_URL = "${{Postgres.DATABASE_URL}}"
# REDIS_URL = "${{Redis.REDIS_URL}}"

# -----------------------------------------------------------------------------
# Worker Service
# -----------------------------------------------------------------------------
[service.worker]
name = "email-system-worker"
runtime = "nodejs20"
startCommand = "npx tsx src/worker/index.ts"

# Worker doesn't need a health check path
# but Railway will monitor the process

# Environment variables
[service.worker.variables]
NODE_ENV = "production"

# -----------------------------------------------------------------------------
# Deployment Configuration
# -----------------------------------------------------------------------------
[deploy]
# Automatic deployments from main branch
[deploy.main]
strategy = "immediate"

# Preview deployments for pull requests
[deploy.preview]
strategy = "immediate"

# -----------------------------------------------------------------------------
# Scaling
# -----------------------------------------------------------------------------
[scale.dashboard]
min = 1
max = 10

[scale.worker]
min = 1
max = 5
